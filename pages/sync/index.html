<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>云端同步</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="workspace">
    <header class="page-heading">
      <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M9 23H7a5 5 0 0 1-.7-10A9 9 0 0 1 23.5 11 6 6 0 0 1 25 23h-2M16 26V15m-4 4 4-4 4 4"/></svg></div>
      <div class="page-title"><h1>云端同步</h1></div>
      <button id="refresh" class="button secondary" type="button"><svg class="button-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 8a6.7 6.7 0 1 0-.8 5.7M16.5 3.5V8H12"/></svg>刷新</button>
    </header>
    <div id="boot-error" class="notice error" role="alert" hidden></div>
    <div id="message" class="notice" role="status" aria-live="polite" hidden></div>
    <section class="stats" aria-label="同步概况">
      <div class="stat"><span>云端连接</span><strong id="connection-label">读取中</strong></div>
      <div class="stat"><span>同步任务</span><strong id="task-count">—</strong></div>
      <div class="stat"><span>执行状态</span><strong id="activity-label">—</strong></div>
    </section>
    <section class="card connection" aria-labelledby="storage-title">
      <div class="section-heading"><div><h2 id="storage-title"><span class="status-dot" id="connection-dot"></span>存储连接</h2></div><div class="actions"><button id="create-remote" class="button primary" type="button">＋ 添加存储</button><button id="open-gui" class="button secondary" type="button">官方 GUI</button></div></div>
      <div id="configuration-status" class="notice" hidden><span id="configuration-description"></span><button id="end-configuration" class="text-button danger" type="button">结束配置</button></div>
      <div class="form-grid"><label class="field">rclone 可执行文件<input id="rclone-binary" spellcheck="false" autocomplete="off" placeholder="rclone 或绝对路径"></label><label class="field">连接名称<div class="input-actions"><input id="rclone-remote" list="remote-options" spellcheck="false" autocomplete="off" placeholder="backup"><datalist id="remote-options"></datalist><button id="reload-remotes" class="text-button" type="button">读取</button><button id="edit-remote" class="text-button" type="button">编辑</button></div></label></div>
      <div class="client-row"><label for="remote-folder">云端同步根目录</label><input id="remote-folder" spellcheck="false" autocomplete="off" placeholder="AstrBotSync 或 桶名/AstrBotSync"></div>
      <div class="connection-actions"><div class="actions"><button id="save-connection" class="button secondary" type="button" disabled>保存连接设置</button><button id="connect" class="button primary" type="button" disabled>检测并连接</button><button id="disconnect" class="text-button danger" type="button" hidden>暂停连接</button></div></div>
      <p id="connection-error" class="error-text" role="alert" hidden></p>
      <details class="setup-guide">
        <summary>安装与授权</summary>
        <div class="guide-action"><button id="install-rclone" class="button secondary" type="button">下载并安装 rclone</button></div>
        <div id="install-status" class="notice" role="status" aria-live="polite" hidden></div>
        <div class="guide-action"><label class="field" for="setup-command">终端配置命令</label><button id="run-setup" class="button secondary" type="button">打开配置向导</button></div>
        <textarea id="setup-command" aria-label="终端配置命令" rows="2" readonly spellcheck="false"></textarea>
        <div class="guide-action"><label class="field" for="reconnect-command">重新授权命令</label><button id="run-reconnect" class="button secondary" type="button">重新授权当前连接</button></div>
        <textarea id="reconnect-command" aria-label="重新授权命令" rows="2" readonly spellcheck="false"></textarea>
      </details>
    </section>
    <nav class="tabs" aria-label="同步管理"><button class="tab active" type="button" data-tab="tasks" aria-pressed="true" aria-controls="tasks-panel">同步任务</button><button class="tab" type="button" data-tab="runs" aria-pressed="false" aria-controls="runs-panel">执行记录</button></nav>
    <section id="tasks-panel" class="card panel" aria-labelledby="tasks-title">
      <div class="section-heading"><div><h2 id="tasks-title">同步任务</h2></div><button id="new-task" class="button primary" type="button" disabled>＋ 新建任务</button></div>
      <div id="task-list" class="task-list"><p class="empty">正在读取任务…</p></div>
    </section>
    <section id="runs-panel" class="card panel" aria-labelledby="runs-title" hidden>
      <div class="section-heading"><div><h2 id="runs-title">执行记录</h2></div></div>
      <div id="run-list"><p class="empty">暂无执行记录。</p></div>
    </section>
  </main>
  <dialog id="task-dialog" aria-labelledby="task-dialog-title">
    <form id="task-form" class="dialog-form">
      <div class="dialog-heading"><div><h2 id="task-dialog-title">新建同步任务</h2></div><button id="close-task" class="text-button" type="button" aria-label="关闭任务编辑">关闭</button></div>
      <div class="dialog-body">
        <label class="field">任务名称<input id="task-name" maxlength="100" required placeholder="例如：插件数据同步"></label>
        <label class="field">同步模式<select id="task-mode" required><option value="upload">上传更新 · 本机 → 云端</option><option value="upload_mirror">镜像到云端 · 本机 → 云端</option><option value="download">下载更新 · 云端 → 本机</option><option value="download_mirror">镜像到本地 · 云端 → 本机</option></select></label>
        <p id="mode-description" class="notice"></p>
        <div class="field"><label id="local-path-label" for="task-local">本机来源（文件／目录）</label><input id="task-local" required spellcheck="false" placeholder="填写 AstrBot 所在机器上的一个路径"><div id="local-examples" class="example-row"><button id="example-plugins" class="chip" type="button">插件数据目录</button><button id="example-backups" class="chip" type="button">AstrBot 导出目录</button></div></div>
        <label class="field"><span id="remote-path-label">云端目标子目录</span><input id="task-remote" required maxlength="1024" spellcheck="false" placeholder="例如 plugin-data"></label>
        <p class="destination"><code id="task-destination"></code></p>
        <label class="field">排除规则（每行一条）<textarea id="task-exclude" rows="2" spellcheck="false" placeholder="*.tmp&#10;cache/**"></textarea></label>
        <label class="field">执行间隔（分钟，0 为手动）<input id="task-interval" type="number" min="0" max="525600" step="1" value="0" required></label>
        <label class="checkbox-label"><input id="task-enabled" type="checkbox" checked>启用定时执行</label>
        <div id="preview-result" class="notice" role="status" hidden></div><div id="task-error" class="notice error" role="alert" hidden></div>
      </div>
      <div class="dialog-actions"><button id="preview" class="button secondary" type="button">预览变更</button><button id="save-task" class="button primary" type="submit">保存任务</button></div>
    </form>
  </dialog>
  <dialog id="config-dialog" aria-labelledby="config-title">
    <form id="config-form" class="dialog-form" autocomplete="off">
      <div class="dialog-heading"><div><h2 id="config-title">添加存储连接</h2></div><button id="close-config" class="text-button" type="button">取消</button></div>
      <div class="dialog-body">
        <div id="config-basics"><div class="form-grid"><label class="field">连接名称<input id="config-name" maxlength="64" required pattern="[A-Za-z0-9_][A-Za-z0-9_-]{0,63}" placeholder="例如 backup"></label><label class="field">存储后端<select id="config-backend" required></select></label></div><div id="config-fields"></div><details id="advanced-options"><summary>高级选项</summary><div id="config-advanced"></div></details></div>
        <div id="config-question" hidden></div><div id="config-error" class="notice error" role="alert" hidden></div>
      </div>
      <div class="dialog-actions"><button id="submit-config" class="button primary" type="submit">下一步</button></div>
    </form>
  </dialog>
  <dialog id="gui-dialog" aria-labelledby="gui-title">
    <form id="gui-form" class="dialog-form" autocomplete="off">
      <div class="dialog-heading"><div><h2 id="gui-title">高级配置</h2></div><button id="close-gui" class="text-button" type="button">关闭面板</button></div>
      <div class="dialog-body">
        <p class="notice">配置期间暂停同步，15 分钟后自动停止。</p>
        <div id="gui-settings"><label class="field">访问方式<select id="gui-listen"><option value="127.0.0.1">本机访问（仅监听 127.0.0.1）</option><option value="0.0.0.0">服务器 / Docker（监听所有网卡）</option></select></label><div class="form-grid"><label class="field">GUI 端口<input id="gui-port" type="number" min="1024" max="65535" value="5580" required></label><label class="field">API 端口<input id="api-port" type="number" min="1024" max="65535" value="5581" required></label></div><label class="field">浏览器可访问的 GUI 地址<input id="gui-url" type="url" value="http://127.0.0.1:5580" required></label><label class="field">浏览器可访问的 API 地址<input id="api-url" type="url" value="http://127.0.0.1:5581" required></label></div>
        <div id="gui-result" hidden><label class="field">官方 GUI 登录地址<textarea id="gui-login" rows="3" readonly spellcheck="false"></textarea></label><p class="notice">复制地址到浏览器打开，请勿分享。</p><button id="copy-gui" class="button secondary" type="button">复制访问地址</button></div>
        <div id="gui-error" class="notice error" role="alert" hidden></div>
      </div>
      <div class="dialog-actions"><button id="stop-gui" class="button secondary" type="button" hidden>结束配置并停止服务</button><button id="start-gui" class="button primary" type="submit">启动官方 GUI</button></div>
    </form>
  </dialog>
  <dialog id="confirmation" aria-labelledby="confirmation-title"><form method="dialog"><h2 id="confirmation-title">确认操作</h2><p id="confirmation-text"></p><div class="dialog-actions"><button class="button secondary" value="cancel">取消</button><button id="confirm-action" class="button primary" value="confirm">确认</button></div></form></dialog>
</body>
</html>
